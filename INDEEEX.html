<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Website</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #eef4ff;
      padding: 50px 20px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      max-width: 500px;
      margin: auto;
    }

    h1 { color: #2457c5; }

    button {
      background: #2457c5;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello, World! 👋</h1>
    <p>Welcome to my first website.</p>
    <p>I am learning how to build things with GitHub.</p>
    <button onclick="alert('My website works!')">
      Click Me
    </button>
  </div>
</body>
</html>
